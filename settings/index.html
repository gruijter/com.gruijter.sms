<!doctype html>
<html>
	<head>
		<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
		<script type="text/javascript" src="settings.js" data-origin="settings"></script>
	</head>
	<body>
		<header class="homey-header">
			<h1 class="homey-title" data-i18n="settings.benefit">Send SMS via flow</h1>
		</header>

		<div>
			<button id="tabb1" class="homey-button-primary" onclick="showTab(1)" data-i18n="settings.tab1.title">Settings</button>
			<button id="tabb2" class="homey-button-secondary" onclick="showTab(2)" data-i18n="settings.tab2.title">Log</button>
		</div>

		<!-- Provider settings panel -->
		<div id="tab1">
			<p data-i18n="settings.tab1.instructions">Instructions</p>

			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.provider">Provider</legend>

				<div class="homey-form-group">
					<label class="homey-form-label" for="provider" data-i18n="settings.tab1.provider">Provider</label>
					<select class="homey-form-select" id="provider" onchange="providerSelected()"></select>
				</div>

				<p id="providerHint" class="homey-subtitle" style="display: none;"></p>

				<button id="provider_url" class="homey-button-secondary" onclick="openUrl()" data-i18n="settings.tab1.openURL">Provider website</button>
				<button id="reload_settings" class="homey-button-secondary" onclick="loadSettings()" data-i18n="settings.tab1.loadSettings">Reload saved settings</button>

				<div class="homey-form-group" id="api_id_group">
					<label class="homey-form-label" id="api_id_label" for="api_id" data-i18n="settings.tab1.apiID">Api ID</label>
					<input class="homey-form-input" id="api_id" type="text" value="">
				</div>
				<div class="homey-form-group" id="username_group">
					<label class="homey-form-label" id="username_label" for="username" data-i18n="settings.tab1.username">Username</label>
					<input class="homey-form-input" id="username" type="text" value="">
				</div>
				<div class="homey-form-group" id="password_group">
					<label class="homey-form-label" id="password_label" for="password" data-i18n="settings.tab1.password">Password</label>
					<input class="homey-form-input" id="password" type="password" value="">
				</div>
				<div class="homey-form-group" id="from_group">
					<label class="homey-form-label" id="from_label" for="from" data-i18n="settings.tab1.from">From</label>
					<input class="homey-form-input" id="from" type="text" value="">
				</div>

				<button id="save" class="homey-button-primary-full" onclick="save()" data-i18n="settings.tab1.save">Save</button>
			</fieldset>

			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.test">Send test message</legend>

				<div class="homey-form-group">
					<label class="homey-form-label" for="toTest" data-i18n="settings.tab1.toTest">To</label>
					<input class="homey-form-input" id="toTest" type="text" value="">
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="testMessage" data-i18n="settings.tab1.testMessage">Test Message</label>
					<textarea class="homey-form-textarea" id="testMessage" rows="3"></textarea>
				</div>

				<button id="runTest" class="homey-button-secondary-full" onclick="runTest()" data-i18n="settings.tab1.test">Send test message</button>

				<div class="homey-form-group">
					<label class="homey-form-label" for="testResult" data-i18n="settings.tab1.testResult">Message</label>
					<textarea class="homey-form-textarea" id="testResult" rows="4" disabled></textarea>
				</div>
			</fieldset>
		</div>

		<!-- Logging panel -->
		<div id="tab2" style="display: none;">
			<button id="deleteButton" class="homey-button-danger" onclick="deleteLogs()" data-i18n="settings.tab2.deleteLogs">Delete</button>
			<pre id="loglines"></pre>
		</div>
	</body>
</html>
